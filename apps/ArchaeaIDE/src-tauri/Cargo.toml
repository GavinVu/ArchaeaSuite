[package]
name = "archaea-ide"
version = "0.1.1"
description = "ArchaeaIDE"
authors = ["ArchaeaSuite contributors"]
license = "GPL-3.0-or-later"
repository = "https://github.com/GavinVu/ArchaeaSuite"
edition = "2021"
rust-version = "1.77"

[lib]
name = "archaea_ide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
ignore = "0.4"
regex = "1"
base64 = "0.22"
trash = "5"
ureq = { version = "2", default-features = false, features = ["json"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
