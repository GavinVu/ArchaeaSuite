[package]
name = "archaeasuite-launcher"
version = "0.1.0"
description = "ArchaeaSuite Launcher"
authors = ["ArchaeaSuite contributors"]
license = "GPL-3.0-or-later"
repository = "https://github.com/GavinVu/ArchaeaSuite"
edition = "2021"
rust-version = "1.77"

[lib]
name = "archaeasuite_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tokio = { version = "1", features = ["fs", "io-util", "rt", "sync", "time"] }
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
semver = "1"
thiserror = "1"
fs4 = "0.13"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
