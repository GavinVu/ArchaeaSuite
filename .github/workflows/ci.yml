name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog:
    name: Validate catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check catalog against schema
        run: npx --yes ajv-cli@5 validate --spec=draft7 --strict=false -s catalog/catalog.schema.json -d catalog/catalog.json

  photo:
    name: ArchaeaPhoto (test and build, x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Engine and UI tests
        run: dotnet test apps/ArchaeaPhoto --nologo
      - name: Publish (self-contained)
        run: dotnet publish apps/ArchaeaPhoto/src/ArchaeaPhoto -c Release -r win-x64 --self-contained true -p:DebugType=none -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: ArchaeaPhoto-x64
          path: publish
          if-no-files-found: error

  ide:
    name: ArchaeaIDE (test and build, x64)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/ArchaeaIDE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/ArchaeaIDE/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/ArchaeaIDE/src-tauri
      - run: npm ci
      - name: Typecheck and build frontend
        run: npm run build
      - name: Backend tests
        working-directory: apps/ArchaeaIDE/src-tauri
        run: cargo test --locked
      - name: Build executable
        run: npm run tauri build -- --no-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: ArchaeaIDE-x64
          path: apps/ArchaeaIDE/src-tauri/target/release/ArchaeaIDE.exe
          if-no-files-found: error

  test:
    name: Launcher (test and build, x64)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri
      - run: npm ci
      - name: Typecheck and build frontend
        run: npm run build
      - name: Backend tests
        working-directory: launcher/src-tauri
        run: cargo test --locked
      # Unsigned build: proves the installer bundles. Updater artifacts need the
      # signing key, so they are only produced by the release workflow.
      - name: Build installer
        run: npm run tauri build -- --config src-tauri/tauri.unsigned.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: ArchaeaSuite-Launcher-x64-unsigned
          path: launcher/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
