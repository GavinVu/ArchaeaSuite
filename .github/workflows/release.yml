name: Release launcher

# Push a tag like `launcher-v0.2.0` (matching the version in
# src-tauri/tauri.conf.json) to build signed installers for x64 and ARM64 and
# publish them, together with the `latest.json` the launcher's self-updater
# reads, as a GitHub Release.

on:
  push:
    tags: ["launcher-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: launcher-v__VERSION__
          releaseName: ArchaeaSuite Launcher v__VERSION__
          releaseBody: |
            Download the installer for your PC:

            - **Most PCs:** `ArchaeaSuite.Launcher___VERSION___x64-setup.exe`
            - **Windows on ARM:** `ArchaeaSuite.Launcher___VERSION___arm64-setup.exe`

            Already have the launcher? It updates itself — open Settings → Updates.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --target ${{ matrix.target }}
