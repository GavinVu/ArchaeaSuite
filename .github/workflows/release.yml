name: Release launcher

# Push a tag like `launcher-v0.2.0` (matching the version in
# launcher/src-tauri/tauri.conf.json) to build signed installers for x64 and ARM64 and
# publish them, together with the `latest.json` the launcher's self-updater
# reads, as a GitHub Release.

on:
  push:
    tags: ["launcher-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      # One at a time: both builds create the same release and merge their
      # entry into the same latest.json, and doing that concurrently races.
      max-parallel: 1
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri
          key: ${{ matrix.target }}
      - run: npm ci
        working-directory: launcher
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: launcher
          tagName: launcher-v__VERSION__
          releaseName: ArchaeaSuite Launcher v__VERSION__
          releaseBody: |
            Download the installer for your PC:

            - **Most PCs:** `ArchaeaSuiteSetup.exe`
            - **Windows on ARM:** `ArchaeaSuiteSetup-arm64.exe`

            No administrator rights are needed. Windows may show a SmartScreen
            notice because the installer is not code-signed: choose
            **More info → Run anyway**.

            Already have the launcher? It updates itself — open Settings → Updates.
            The versioned `-setup.exe` files are what that updater downloads.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --target ${{ matrix.target }}
      # The same installer again under a name that never changes, so
      # releases/latest/download/ArchaeaSuiteSetup.exe is a permanent link.
      - name: Upload installer under its stable name
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content launcher/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $setup = Get-ChildItem "launcher/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe"
          if (@($setup).Count -ne 1) { throw "expected one installer, found $(@($setup).Count)" }
          $name = if ('${{ matrix.arch }}' -eq 'x64') { 'ArchaeaSuiteSetup.exe' } else { 'ArchaeaSuiteSetup-${{ matrix.arch }}.exe' }
          Copy-Item $setup.FullName $name
          gh release upload "launcher-v$version" $name --clobber --repo $env:GITHUB_REPOSITORY
